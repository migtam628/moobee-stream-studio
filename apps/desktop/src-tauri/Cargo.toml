[package]
name = "moobee-live-desktop"
version = "0.3.9"
description = "MooBee Stream Studio standalone native production center"
edition = "2021"

[lib]
name = "moobee_live_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Developer acceptance builds only; never enabled by default or release CI.
native-live-acceptance = []

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "io-util"] }
tokio-stream = { version = "0.1", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.23"
zeroize = "1"

# Desktop capture is packaged with MooBee. No OBS/Streamlabs process or API.
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
xcap = "0.9.10"
image = { version = "0.25", default-features = false, features = ["png", "gif", "jpeg"] }
font8x8 = "0.3.1"

sysinfo = "0.33"
native-tls = "0.2"
url = "2"
getrandom = "0.3"
# Explicit OS backends; never use keyring mock or plaintext fallback in the desktop app.
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native", "windows-native"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dev-dependencies]
rcgen = "=0.13.2"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
