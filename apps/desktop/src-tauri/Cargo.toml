[package]
name = "moobee-live-desktop"
version = "0.3.5"
description = "MooBee Stream Studio standalone native production center"
edition = "2021"

[lib]
name = "moobee_live_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"

# Desktop capture is packaged with MooBee. No OBS/Streamlabs process or API.
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
xcap = "0.9.10"
image = { version = "0.25", default-features = false, features = ["png", "gif", "jpeg"] }
