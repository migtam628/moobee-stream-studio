name: Build and release MooBee Stream Studio

on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Avoid rebuilding stale pull-request commits on all five platforms.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Gate API, frontend and native media format
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Ensure release branch matches native + web versions
        if: startsWith(github.ref, 'refs/heads/release/')
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const web = JSON.parse(fs.readFileSync('package.json','utf8')).version;
          const tauri = JSON.parse(fs.readFileSync('apps/desktop/src-tauri/tauri.conf.json','utf8')).version;
          const cargo = fs.readFileSync('apps/desktop/src-tauri/Cargo.toml','utf8').match(/^version\s*=\s*"([^"]+)"/m)?.[1];
          const workspaceVersions = [
            'apps/api/package.json',
            'apps/web/package.json',
            'apps/desktop/package.json'
          ].map(path => [path, JSON.parse(fs.readFileSync(path,'utf8')).version]);
          const branch = process.env.GITHUB_REF_NAME || '';
          const match = /^release\/v(\d+\.\d+\.\d+)-alpha\.(\d+)$/.exec(branch);
          // Existing 0.3.x experimental builds use the core package version.
          // Future signed updater releases should set full prerelease versions.
          if (!match || web !== match[1] || tauri !== web || cargo !== web ||
              workspaceVersions.some(([,version]) => version !== web)) {
            console.error('Only aligned experimental alpha versions can publish:', {
              branch, web, tauri, cargo, workspaceVersions
            });
            process.exit(1);
          }
          NODE
      - name: Refuse already-published GitHub release tags
        if: startsWith(github.ref, 'refs/heads/release/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME#release/}"
          # Never overwrite or silently rebuild assets under a published tag.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists. Create a new release/v*-alpha.N branch."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Audit beta blockers (informational; beta publishing remains disabled)
        run: node scripts/check-beta-readiness.mjs
      - run: npm run build
      - name: Install Chromium for release UI validation
        if: startsWith(github.ref, 'refs/heads/release/')
        run: npx playwright install --with-deps chromium
      - name: Gate release on production workspace and simulated native IPC
        if: startsWith(github.ref, 'refs/heads/release/')
        run: npm run test:e2e
      - name: Preserve release UI verification screenshots
        if: always() && startsWith(github.ref, 'refs/heads/release/')
        uses: actions/upload-artifact@v4
        with:
          name: release-ui-verification
          path: .qa/*.png
          include-hidden-files: true
          if-no-files-found: ignore
      - uses: dtolnay/rust-toolchain@stable
      - name: Install FFmpeg for CI-only media verification
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - name: Validate native AVI writer including full video decode
        run: bash scripts/check-avi-muxer.sh
      - name: Validate synthetic MP4 decode, early-stop and audible-audio QA
        run: bash scripts/check-mp4-acceptance.sh

  web:
    name: Self-hosted web distribution
    runs-on: ubuntu-24.04
    needs: verify
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package self-hosted web app and local API
        run: |
          tar -czf "moobee-stream-studio-web-${GITHUB_SHA::7}.tar.gz" \
            package.json package-lock.json \
            apps/api/package.json apps/api/server.mjs apps/api/validation.mjs apps/api/studio.mjs \
            apps/web/package.json apps/web/dist apps/desktop/package.json apps/desktop/src-tauri/resources/overlay.html
      - name: Verify standalone web archive contains its runtime modules
        run: |
          tar -tzf moobee-stream-studio-web-*.tar.gz | grep -qx 'apps/api/studio.mjs'
          tar -tzf moobee-stream-studio-web-*.tar.gz | grep -qx 'apps/desktop/src-tauri/resources/overlay.html'
      - uses: actions/upload-artifact@v4
        with:
          name: web-node-bundle
          path: moobee-stream-studio-web-*.tar.gz
          if-no-files-found: error

  desktop:
    name: Desktop — ${{ matrix.label }}
    if: startsWith(github.ref, 'refs/heads/release/') || github.event_name == 'workflow_dispatch'
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            label: macos-arm64
            args: '--bundles dmg'
          - platform: macos-15-intel
            label: macos-x64
            args: '--bundles dmg'
          - platform: windows-latest
            label: windows-x64
            args: '--bundles nsis'
          - platform: ubuntu-24.04
            label: linux-x64
            args: '--bundles deb'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: npm ci
      - name: Set macOS 13 deployment target for native build
        if: runner.os == 'macOS'
        run: echo 'MACOSX_DEPLOYMENT_TARGET=13.0' >> "$GITHUB_ENV"
      - name: Validate native Swift-linked MP4 box tests on macOS
        if: runner.os == 'macOS'
        working-directory: apps/desktop/src-tauri
        run: |
          cargo test --lib mp4_validation::tests
          cargo test --lib scene_compositor::tests
          cargo test --lib program_test_avi::tests
          cargo test --lib program_continuous_avi::tests
          cargo test --lib program_mp4_sink::tests
          cargo test --lib video_preview::tests
          cargo test --lib media_clock::tests
          cargo test --lib audio_mix::tests
          cargo test --lib program_overlay::tests
          cargo test --lib stream_mux::tests
      - name: Build desktop installer
        uses: tauri-apps/tauri-action@v1
        env:
          APPLE_SIGNING_IDENTITY: '-'
        with:
          projectPath: apps/desktop
          args: ${{ matrix.args }}
      - name: Validate packaged macOS minimum version and Swift runtime
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          DMG="$(find apps/desktop/src-tauri/target/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$DMG" || { echo "::error::Built macOS DMG not found"; exit 1; }
          bash scripts/verify-macos-app-bundle.sh --dmg "$DMG"
      - name: Collect installer files
        shell: bash
        run: |
          mkdir -p release-assets
          find apps/desktop/src-tauri/target -type f \( -name '*.dmg' -o -name '*.deb' -o -name '*setup.exe' \) -print -exec sh -c 'cp "$1" "release-assets/${{ matrix.label }}-$(basename "$1")"' _ '{}' \;
          test -n "$(find release-assets -type f -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.label }}
          path: release-assets/*
          if-no-files-found: error

  android:
    name: Android ARM64 test APK
    if: startsWith(github.ref, 'refs/heads/release/') || github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Cache downloaded Gradle plugins, Kotlin and Maven coordinates across
      # new release branches; this reduces cold-start Maven Central traffic.
      - name: Configure Gradle dependency caching
        uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
      - name: Install Android toolchain
        run: |
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
      - name: Generate Tauri Android project
        working-directory: apps/desktop
        run: npx tauri android init --ci
      - name: Build Android debug-signed APK (retry only transient Maven 429)
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          log="$(mktemp)"
          trap 'rm -f "$log"' EXIT
          for attempt in 1 2 3; do
            echo "Android debug APK build attempt $attempt/3"
            if npx tauri android build --apk --debug --target aarch64 --ci 2>&1 | tee "$log"; then
              exit 0
            fi
            # Re-run only rate-limited Maven/Gradle dependency resolution.
            # Compilation, configuration and signing errors must fail immediately.
            if ! grep -Eqi 'Received status code 429|HTTP[[:space:]]*429|429 Too Many Requests|status code:[[:space:]]*429' "$log"; then
              echo "::error::Android build failed for a non-throttling reason."
              exit 1
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "::error::Android dependencies still rate-limited after bounded retries."
              # The only allowed exception to complete alpha publication.
              # An independent release job validates this exact marker.
              printf '{"schemaVersion":1,"reason":"maven-http-429","target":"android-arm64-debug"}\n' > ../../android-dependency-throttle.json
              exit 1
            fi
            delay=$((30 * attempt))
            echo "::warning::Transient dependency HTTP 429; retrying in ${delay}s."
            sleep "$delay"
          done
      - name: Publish verifiable Android dependency throttle marker
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-dependency-throttle
          path: android-dependency-throttle.json
          if-no-files-found: ignore
      - name: Collect installable debug APK
        run: |
          mkdir -p release-assets
          find apps/desktop/src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' -exec cp '{}' release-assets/moobee-stream-studio-android-arm64-debug.apk \;
          test -s release-assets/moobee-stream-studio-android-arm64-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-arm64-debug
          path: release-assets/*.apk
          if-no-files-found: error

  publish:
    name: Publish alpha prerelease
    if: ${{ always() && startsWith(github.ref, 'refs/heads/release/') && needs.verify.result == 'success' && needs.web.result == 'success' && needs.desktop.result == 'success' && (needs.android.result == 'success' || needs.android.result == 'failure') }}
    needs: [verify, web, desktop, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Publish standalone prerelease and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_JOB_RESULT: ${{ needs.android.result }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#release/}"
          case "$TAG" in v*) ;; *) echo 'Release branch must be named release/v*' >&2; exit 1 ;; esac
          ANDROID_THROTTLED=false
          manifest_args=()
          if [[ "$ANDROID_JOB_RESULT" == 'failure' ]]; then
            MARKER="$(find release-assets -type f -name 'android-dependency-throttle.json' -print -quit)"
            test -n "$MARKER" && test -s "$MARKER" || {
              echo "::error::Android failed without a verified Maven 429 marker. Refusing incomplete alpha."
              exit 1
            }
            MARKER_FILE="$MARKER" node -e '
              const fs = require("node:fs");
              const marker = JSON.parse(fs.readFileSync(process.env.MARKER_FILE, "utf8"));
              if (marker.schemaVersion !== 1 || marker.reason !== "maven-http-429" ||
                  marker.target !== "android-arm64-debug") {
                throw new Error("Invalid Android throttling evidence; refusing incomplete release");
              }
            '
            rm -f "$MARKER"
            if find release-assets -type f -name 'moobee-stream-studio-android-arm64-debug.apk' -print -quit | grep -q .; then
              echo "::error::Android APK exists but build is recorded as failed."
              exit 1
            fi
            ANDROID_THROTTLED=true
            manifest_args+=(--android-throttled)
            echo "::warning::Publishing an explicitly partial experimental alpha without Android test APK after verified Maven HTTP 429."
          elif [[ "$ANDROID_JOB_RESULT" != 'success' ]]; then
            echo "::error::Android job was not completed: $ANDROID_JOB_RESULT"
            exit 1
          fi
          mapfile -d '' FILES < <(find release-assets -type f -print0)
          test "${#FILES[@]}" -ge 5
          for expected in macos-arm64 macos-x64 windows-x64 linux-x64; do
            find release-assets -type f -name "${expected}-*" -print -quit | grep -q . || { echo "Missing installer for ${expected}"; exit 1; }
          done
          if [[ "$ANDROID_THROTTLED" != 'true' ]]; then
            find release-assets -type f -name 'moobee-stream-studio-android-arm64-debug.apk' -print -quit | grep -q . || {
              echo "Missing Android APK without verified Maven 429 exception"; exit 1;
            }
          fi
          find release-assets -type f -name 'moobee-stream-studio-web-*.tar.gz' -print -quit | grep -q . || { echo "Missing web distribution"; exit 1; }
          node scripts/build-release-manifest.mjs release-assets "$TAG" "$GITHUB_SHA" "${manifest_args[@]}" > RELEASE-MANIFEST.json
          cp docs/RELEASE_NOTES.md RELEASE-NOTES.txt
          if [[ "$ANDROID_THROTTLED" == 'true' ]]; then
            printf '%s\n' \
              '' '## Android package not included in this experimental release' \
              '' 'The optional Android ARM64 debug APK was not built because Maven Central returned' \
              'HTTP 429 on dependency downloads after three bounded attempts. This release contains' \
              'Mac ARM64/Intel, Windows x64, Linux x64 and web archives only. The signedness and' \
              'hardware acceptance of these experimental packages are unchanged. The manifest' \
              'explicitly identifies Android as unavailable; do not substitute another build tag.' \
              >> RELEASE-NOTES.txt
          fi
          while IFS= read -r -d '' file; do
            ( cd "$(dirname "$file")" && sha256sum "$(basename "$file")" )
          done < <(find release-assets -type f -print0 | sort -z) > SHA256SUMS.txt
          sha256sum RELEASE-MANIFEST.json >> SHA256SUMS.txt
          # Protect artifact provenance: a tag is immutable from our pipeline.
          # Releasing a correction requires a fresh alpha/beta/rc identifier.
          if gh release view "$TAG" >/dev/null 2>&1 || \
             gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Refusing to reuse already published release/tag $TAG"
            exit 1
          fi
          gh release create "$TAG" "${FILES[@]}" RELEASE-MANIFEST.json SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "MooBee Stream Studio $TAG — Standalone Capture Alpha" \
            --notes-file RELEASE-NOTES.txt \
            --prerelease

