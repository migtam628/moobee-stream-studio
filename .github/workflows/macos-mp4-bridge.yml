name: Compile native macOS ScreenCaptureKit MP4 adapter

on:
  pull_request:
  push:
    branches: [main, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

# Keep only the latest PR's native macOS compile; older Swift/Rust builds can
# otherwise queue behind a newer patch and waste platform CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  screen-recording:
    name: ScreenCaptureKit Swift ABI — ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            label: Apple Silicon
            swift_target: arm64-apple-macos13.0
          - runner: macos-15-intel
            label: Intel
            swift_target: x86_64-apple-macos13.0
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v4
      - name: Check Swift type correctness against the macOS 15+ SDK
        run: |
          SDK="$(xcrun --sdk macosx --show-sdk-path)"
          xcrun swiftc -swift-version 5 -parse-as-library -typecheck \
            -target "${{ matrix.swift_target }}" -sdk "$SDK" \
            apps/desktop/src-tauri/swift/MooBeeScreenRecording.swift \
            apps/desktop/src-tauri/swift/MooBeeSonomaRecording.swift \
            apps/desktop/src-tauri/swift/MooBeeProgramVideoWriter.swift \
            apps/desktop/src-tauri/swift/MooBeeAVCEncoder.swift \
            apps/desktop/src-tauri/swift/MooBeeAACEncoder.swift \
            apps/desktop/src-tauri/swift/MooBeeProgramCamera.swift \
            apps/desktop/src-tauri/swift/MooBeeProgramMicrophone.swift
      - name: Exercise ScreenCaptureKit stop recovery policy
        run: |
          SDK="$(xcrun --sdk macosx --show-sdk-path)"
          xcrun swiftc -swift-version 5 -parse-as-library \
            -target "${{ matrix.swift_target }}" -sdk "$SDK" \
            apps/desktop/src-tauri/swift/MooBeeScreenRecording.swift \
            apps/desktop/src-tauri/swift/MooBeeSonomaRecording.swift \
            apps/desktop/src-tauri/swift/tests/RecordingStopPolicy.swift \
            -o "$RUNNER_TEMP/moobee-stop-policy"
          "$RUNNER_TEMP/moobee-stop-policy"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
      - name: Compile native Rust-Tauri and linked Swift recorder
        run: |
          npm run build
          cd apps/desktop/src-tauri
          cargo check
      - name: Link native test binary and validate MP4 container regressions
        run: |
          cd apps/desktop/src-tauri
          cargo test --lib mp4_validation::tests
          cargo test --lib scene_compositor::tests
          cargo test --lib source_transform::tests
          cargo test --lib program_test_avi::tests
          cargo test --lib program_continuous_avi::tests
          cargo test --lib live_flv::tests
          cargo test --lib live_lifecycle::tests
          cargo test --lib live_health::tests
          cargo test --lib live_reconnect::tests
          cargo test --lib live_rejoin::tests
          cargo test --lib live_soak::tests
          cargo test --lib live_startup::tests
          cargo test --lib live_bitrate::tests
          cargo test --lib program_alert_layer::tests
          cargo test --lib live_acceptance::tests
          cargo check --features native-live-acceptance
          cargo test --features native-live-acceptance --lib live_acceptance::tests
          cargo test --lib stream_destinations::tests
          cargo test --lib program_mp4_sink::tests
          cargo test --lib program_mp4_storage::tests
          cargo test --lib program_camera::tests
          cargo test --lib video_preview::tests
          cargo test --lib media_clock::tests
          cargo test --lib audio_mix::tests
          cargo test --lib program_audio::tests
          cargo test --lib program_overlay::tests
          cargo test --lib stream_mux::tests
          cargo test --lib rtmp_receive::tests
          cargo test --lib rtmp_session -- --nocapture
          cargo test --lib rtmps_test_receiver
          cargo test --lib live_media_queue::tests
          cargo test --lib live_packet_pacer::tests
          cargo test --lib macos_avc::tests
          cargo test --lib macos_aac::tests
          cargo test --lib live_program_encoder::tests
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent receiver QA decoder if missing
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then brew install ffmpeg; fi
          ffmpeg -version
          ffprobe -version
      - name: Decode synthetic native AVC and AAC through encrypted loopback
        run: python scripts/verify-native-rtmps-decode.py
      # A cargo check or test binary is not an installed Tauri application.
      # Verify at least one actual .app contains the Swift runtime rpath and
      # permission reasons before considering hardware acceptance.
      - name: Package unsigned Apple Silicon macOS app for acceptance
        if: github.event_name == 'workflow_dispatch' && matrix.label == 'Apple Silicon'
        working-directory: apps/desktop
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: npx tauri build --bundles app
      - name: Inspect packaged macOS runtime and privacy declarations
        if: github.event_name == 'workflow_dispatch' && matrix.label == 'Apple Silicon'
        shell: bash
        run: bash scripts/verify-macos-app-bundle.sh
